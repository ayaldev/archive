<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMD Facebook Multi-Key Controller Pro</title>
    <style>

            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 80px 0 120px 0;
            position: relative;
            box-sizing: border-box;
        }

        .container {
            background-color: #1a1a1e;
            border: 1px solid #29292e;
            border-radius: 12px;
            padding: 30px;

        /* Hover-Expanding Top-Left Power/Reboot Button */
        .reboot-corner-wrap {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 200;
        }

        .reboot-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0px;
            width: 42px;
            height: 42px;
            background-color: #242429;
            border: 1px solid #3a3a42;
            color: #f75a68;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            overflow: hidden;
            white-space: nowrap;

            padding: 0;
        }

        .reboot-btn .icon {
            font-size: 1.2rem;
            display: inline-block;
            min-width: 40px;
            text-align: center;
        }

        .reboot-btn .text {
            max-width: 0;
            opacity: 0;

        .reboot-btn:hover {

        .radio-container {

        /* Input Container wrappers for Overflow Fade effects */
        .input-wrapper {

            align-items: center;

            border: 1px solid #29292e;
            border-radius: 6px;
            transition: border-color 0.2s;
            overflow: hidden;
            height: 40px;

        }
        
        .input-wrapper:focus-within {

        .label-wrapper {

            flex-shrink: 0;

        .middle-wrapper {
            width: 180px;
            flex-shrink: 0;
        }

        .key-wrapper {
            flex-grow: 1;
        }

        /* Fade overlay applied at the right edge of copyable inputs before the button space */
        .fade-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            right: 32px; 
            width: 25px;
            height: 100%;
            background: linear-gradient(to right, rgba(18,18,20,0) 0%, rgba(18,18,20,1) 100%);
            pointer-events: none;
        }

        /* Standard text input fields layout properties */
        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            background-color: transparent;
            border: none;
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Contenteditable Preview Display container updates */
        .editable-box-field {
            display: block;
            width: 100%;
            max-height: 40px;
            padding: 10px 12px;
            background-color: transparent;
            border: none;
            color: #fff;
            font-size: 0.95rem;
            line-height: 1.25rem;
            box-sizing: border-box;
            outline: none;
            white-space: pre; 
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            text-align: left;
        }

        .fade-overlay input[type="text"], .fade-overlay .editable-box-field {
            padding-right: 35px; 
        }

        .label-wrapper .editable-box-field {
            font-weight: bold;
            color: #a8a8b3;
        }

        /* Contextual Inline Copy Button */
        .inline-copy-btn {
            position: absolute;
            right: 6px;
            background: none;
            border: none;
            color: #6e6e77;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
            z-index: 5;
            transition: color 0.2s;
        }
        .inline-copy-btn:hover {
            color: #1877f2;
        }

        /* Plain Stream Key Input field */
        .key-wrapper input[type="text"] {
            background-color: #121214;
            cursor: text;
        }

        /* Select All and Paste Button */
        .paste-btn {
            background-color: #242429;
            border: 1px solid #3a3a42;
            color: #a8a8b3;
            border-radius: 6px;
            padding: 10px 10px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            height: 40px;
            box-sizing: border-box;
        }

        .paste-btn:hover {
            background-color: #1877f2;
            border-color: #388af4;
            color: #fff;
        }

        /* Modal Structure for Textarea Popup Layouts */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background-color: #1a1a1e;
            border: 1px solid #29292e;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            padding: 20px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #29292e;
            padding-bottom: 10px;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }

        .modal-close {
            background: none;
            border: none;
            color: #a8a8b3;
            font-size: 1.3rem;
            cursor: pointer;
        }

        .modal-card textarea {
            width: 100%;
            height: 160px;
            background-color: #121214;
            border: 1px solid #29292e;
            border-radius: 6px;
            color: #fff;
            padding: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
        }
        .modal-card textarea:focus {
            border-color: #1877f2;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-btn {
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .modal-btn-cancel {
            background-color: #242429;
            color: #a8a8b3;
            border: 1px solid #3a3a42;
        }

        .modal-btn-save {
            background-color: #1877f2;
            color: #fff;
        }

        /* Fixed Sticky Bottom Action Container */
        .floating-action-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(21, 21, 24, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid #29292e;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            z-index: 500;
            box-shadow: 0 -8px 24px rgba(0,0,0,0.4);
        }

        .action-row {
            display: flex;
            gap: 15px;
            align-items: center;
            width: 100%;
            max-width: 550px;
            padding: 0 30px;
            box-sizing: border-box;
        }

        .action-btn {
            flex-grow: 1;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            transition: background-color 0.2s, transform 0.1s;
        }

        .action-btn:active {
            transform: scale(0.99);
        }

        .state-idle { background-color: #00b37e; }
        .state-idle:hover { background-color: #00996c; }

        .state-streaming { background-color: #f75a68; }
        .state-streaming:hover { background-color: #e54e5d; }

        .state-restart { background-color: #ff9f43; }
        .state-restart:hover { background-color: #ee5a24; }

        .select-wrapper {
            position: relative;
            width: 120px;
            flex-shrink: 0;
        }

        select {
            width: 100%;
            padding: 16px 30px 16px 12px;
            background-color: #1e1e24;
            border: 1px solid #29292e;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            box-sizing: border-box;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' fill='%23fff'><polygon points='0,0 10,0 5,5'/></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
        }

        select:focus {
            border-color: #1877f2;
            outline: none;
        }
    </style>
</head>
<body>

<div class="reboot-corner-wrap">
    <button id="reboot-btn" class="reboot-btn" onclick="handleRebootTrigger()" title="Force Hardware Protocol Reboot">
        <span class="icon">⏽</span><span class="text">Reboot</span>
    </button>
</div>

<div class="container">
    <div class="key-matrix">
        <div id="dynamic-matrix-target"></div>
    </div>
</div>

<div class="modal-overlay" id="text-modal">
    <div class="modal-card">
        <div class="modal-header">
            <div class="modal-title" id="modal-title-text">Edit Field Content</div>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <textarea id="modal-textarea" placeholder="Enter custom context text configurations..."></textarea>
        <div class="modal-actions">
            <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="modal-btn modal-btn-save" onclick="saveModalContent()">Apply changes</button>
        </div>
    </div>
</div>

<div class="floating-action-bar">
    <div class="action-row">
        <button id="master-btn" class="action-btn state-idle" onclick="handleMasterAction()">Checking status...</button>
        <div class="select-wrapper">
            <select id="delay-select" title="Facebook Server Reset Delay Window">
                <option value="0">0s Delay</option>
                <option value="1" selected>1s Delay</option>
                <option value="10">10s Delay</option>
                <option value="20">20s Delay</option>
                <option value="30">30s Delay</option>
                <option value="40">40s Delay</option>
                <option value="50">50s Delay</option>
                <option value="60">60s Delay</option>
            </select>
        </div>
    </div>
</div>

<script>
const BASE_URL = 'http://192.168.50.249/control/api/v1';
const PROTOCOL_URL = 'http://192.168.50.249:9977';
const masterBtn = document.getElementById('master-btn');
const rebootBtn = document.getElementById('reboot-btn');
const delaySelect = document.getElementById('delay-select');

let isStreaming = false;
let isProcessing = false;
let activeStreamKey = ""; 
let isKeyEdited = false;
let currentActiveInputId = null;

const rowMetaData = [
    {id: 1, defLabel: "BALITANG PROMDI with KISSES JABSON"}, {id: 2, defLabel: "MAGANDANG UMAGA PILIPINAS with ANGELO PALMONES"}, {id: 3, defLabel: "DOS POR DOS with ANTHONY TABERNA & GERRY BAJA"}, {id: 4, defLabel: "DAMDAMING BAYAN with DEO MACALMA & ELAINE APIT"},
    {id: 5, defLabel: "OPERATION TULONG with MAE BINAUHAN"}, {id: 6, defLabel: "MAGANDANG UMAGA PILIPINAS with ANGELO PALMONES"}, {id: 7, defLabel: "MBC TV Network News"}, {id: 8, defLabel: "THE BETTER NEWS with ROVHIC MANUEL"},
    {id: 9, defLabel: "Trending N’ Viral Show"}, {id: 10, defLabel: "RAPIDO HATAW BALITA with REY SIBAYAN & ROMMEL FUERTES"}, {id: 11, defLabel: "PUBLIC SERVICE HOUR with MAE BINAUHAN"}, {id: 12, defLabel: "BREAKTIME with DEO MACALMA & THEA PECHO-CORPUZ"},
    {id: 13, defLabel: "BALANSYADO with HENRY URI & KAREN OW-YONG"}, {id: 14, defLabel: "Usapang Legal"}, {id: 15, defLabel: "Usapang Legal 2"}, {id: 16, defLabel: "LUNAS"}, {id: 17, defLabel: "LUNAS EXTENSION"},
    {id: 18, defLabel: "TOMORROW'S NEWS TONIGHT with REY SIBAYAN & KISSES JABSON"}, {id: 19, defLabel: "SHOWBIZ TALK GANERN with MORLY ALINIO & GORGY RULA"}, {id: 20, defLabel: "AKSYON KABABAIHAN"}, {id: 21, defLabel: "TEM"},
    {id: 22, defLabel: "RHB2"}, {id: 23, defLabel: "TMBY"}, {id: 24, defLabel: "ADB"}, {id: 25, defLabel: "SOS"},
    {id: 26, defLabel: "EXS"}, {id: 27, defLabel: "MP"}, {id: 28, defLabel: "HBY"}, {id: 29, defLabel: "RHBSAT"},
    {id: 30, defLabel: "SZ"}, {id: 31, defLabel: "MP2"}, {id: 32, defLabel: "DARQ"}, {id: 33, defLabel: "DSKTE"},
    {id: 34, defLabel: "AA"}, {id: 35, defLabel: "KMY"}, {id: 36, defLabel: "BOOM"}, {id: 37, defLabel: "SL"},
    {id: 38, defLabel: "HBD"}, {id: 39, defLabel: "LSAT"}, {id: 40, defLabel: "LXSAT"}, {id: 41, defLabel: "SS"},
    {id: 42, defLabel: "GNM"}, {id: 43, defLabel: "SU"}, {id: 44, defLabel: "MBL"}, {id: 45, defLabel: "MUP"},
    {id: 46, defLabel: "IP"}, {id: 47, defLabel: "DOCU"}, {id: 48, defLabel: "HNTHN"}, {id: 49, defLabel: "AGMD"},
    {id: 50, defLabel: "RHBSUN"}, {id: 51, defLabel: "POV"}, {id: 52, defLabel: "HCP1"}, {id: 53, defLabel: "MASS"},
    {id: 54, defLabel: "EO"}, {id: 55, defLabel: "A2A"}, {id: 56, defLabel: "RHNYO"}, {id: 57, defLabel: "MTRBHO"},
    {id: 58, defLabel: "HCP2"}, {id: 59, defLabel: "LXSUN"}, {id: 60, defLabel: "KPNLIG"}, {id: 61, defLabel: "SOH"},
    {id: 62, defLabel: "ST"}, {id: 63, defLabel: "BSYAT"}, {id: 64, defLabel: "FTO"}
];

function renderMatrix() {
    const target = document.getElementById("dynamic-matrix-target");
    let htmlContent = "";

    rowMetaData.forEach((row, index) => {
        const isChecked = index === 0 ? "checked" : "";
        const selectClass = index === 0 ? "selected-row" : "";

        htmlContent += `
        <div class="key-row ${selectClass}" id="row-${row.id}">
            <div class="radio-container">
                <input type="radio" name="active-key-selector" value="${row.id}" ${isChecked} onchange="updateRowFocus()">
            </div>
            
            <div class="input-wrapper label-wrapper fade-overlay">
                <div class="editable-box-field" id="label-field-${row.id}" onclick="openModalPopup('label-field-${row.id}')" contenteditable="false"></div>
                <button class="inline-copy-btn" onclick="copyValueInline(event, 'label-field-${row.id}')" title="Copy Title">📋</button>
            </div>

            <div class="input-wrapper middle-wrapper fade-overlay">
                <div class="editable-box-field" id="middle-field-${row.id}" onclick="openModalPopup('middle-field-${row.id}')" contenteditable="false"></div>
                <button class="inline-copy-btn" onclick="copyValueInline(event, 'middle-field-${row.id}')" title="Copy Description">📋</button>
            </div>

            <div class="input-wrapper key-wrapper">
                <input type="text" class="stream-key-input" id="stream-key-${row.id}" placeholder="Paste Stream Key ${row.id}..." oninput="saveKeyDirectly(event)">
            </div>

            <button class="paste-btn" onclick="handleSelectAndPaste(${row.id})" title="Select all & Paste from Clipboard">📋➕ Paste</button>
        </div>`;
    });

    target.innerHTML = htmlContent;
}

renderMatrix();

function loadSavedKeys() {
    rowMetaData.forEach(row => {
        // Load Stream Keys
        const savedKey = localStorage.getItem(`stream-key-${row.id}`);
        const keyInput = document.getElementById(`stream-key-${row.id}`);
        if (savedKey !== null) {
            keyInput.value = savedKey;
        }

        // Load Custom Titles
        const savedLabel = localStorage.getItem(`label-field-${row.id}`);
        const labelDiv = document.getElementById(`label-field-${row.id}`);
        if (savedLabel !== null && savedLabel.trim() !== "") {
            labelDiv.innerText = savedLabel;
        } else {
            labelDiv.innerText = row.defLabel;
        }

        // Load Descriptions 
        const savedMiddle = localStorage.getItem(`middle-field-${row.id}`);
        const middleDiv = document.getElementById(`middle-field-${row.id}`);
        if (savedMiddle !== null && savedMiddle.trim() !== "") {
            middleDiv.innerText = savedMiddle;
        } else {
            middleDiv.innerText = row.defLabel;
        }
    });
}

function saveKeyDirectly(event) {
    const targetInput = event.target;
    localStorage.setItem(targetInput.id, targetInput.value);
    evaluateKeyStateChange();
}

async function handleSelectAndPaste(rowId) {
    const targetInput = document.getElementById(`stream-key-${rowId}`);
    try {
        const clipboardText = await navigator.clipboard.readText();
        if (clipboardText) {
            targetInput.value = clipboardText.trim();
            localStorage.setItem(targetInput.id, targetInput.value);
            evaluateKeyStateChange();
            targetInput.select();
        }
    } catch (err) {
        targetInput.focus();
        targetInput.select();
        document.execCommand('paste');
    }
}

function openModalPopup(inputId) {
    currentActiveInputId = inputId;
    const targetField = document.getElementById(inputId);
    const textAreaModal = document.getElementById("modal-textarea");
    const modalTitle = document.getElementById("modal-title-text");

    textAreaModal.value = targetField.innerText;
    
    if (inputId.startsWith("label")) {
        modalTitle.innerText = "Title";
    } else {
        modalTitle.innerText = "Description";
    }

    document.getElementById("text-modal").classList.add("active");
    setTimeout(() => textAreaModal.focus(), 50);
}

function closeModal() {
    document.getElementById("text-modal").classList.remove("active");
    currentActiveInputId = null;
}

function saveModalContent() {
    if (!currentActiveInputId) return;

    const textAreaModal = document.getElementById("modal-textarea");
    const originalInput = document.getElementById(currentActiveInputId);

    originalInput.innerText = textAreaModal.value;
    localStorage.setItem(currentActiveInputId, textAreaModal.value);
    
    closeModal();
}

function copyValueInline(event, inputId) {
    event.stopPropagation(); 
    const referenceField = document.getElementById(inputId);
    const triggerBtn = event.target;

    if (!referenceField.innerText) return;

    navigator.clipboard.writeText(referenceField.innerText).then(() => {
        triggerBtn.innerText = "✓";
        triggerBtn.style.color = "#00b37e";
        setTimeout(() => {
            triggerBtn.innerText = "📋";
            triggerBtn.style.color = "";
        }, 1250);
    }).catch(() => {
        const range = document.createRange();
        range.selectNodeContents(referenceField);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        document.execCommand('copy');
    });
}

function getSelectedStreamKey() {
    const activeRadio = document.querySelector('input[name="active-key-selector"]:checked');
    if (!activeRadio) return "";
    const activeIndex = activeRadio.value;
    return document.getElementById(`stream-key-${activeIndex}`).value.trim();
}

function updateRowFocus() {
    document.querySelectorAll('.key-row').forEach(row => row.classList.remove('selected-row'));
    const activeRadio = document.querySelector('input[name="active-key-selector"]:checked');
    if (activeRadio) {
        document.getElementById(`row-${activeRadio.value}`).classList.add('selected-row');
    }
    evaluateKeyStateChange();
}

function evaluateKeyStateChange() {
    if (isStreaming) {
        const currentSelectedKey = getSelectedStreamKey();
        if (currentSelectedKey !== activeStreamKey) {
            isKeyEdited = true;
            masterBtn.innerText = "RESTART WITH NEW KEY";
            masterBtn.className = "action-btn state-restart";
        } else {
            isKeyEdited = false;
            masterBtn.innerText = "STOP STREAM";
            masterBtn.className = "action-btn state-streaming";
        }
    }
}

async function checkCurrentStatus() {
    if (isProcessing) return; 

    try {
        const response = await fetch(`${BASE_URL}/livestreams/0`);
        if (!response.ok) throw new Error('Offline');
        const data = await response.json();
        
        const streamingNow = (data.status === "Streaming" || data.status === "Connecting");
        
        if (streamingNow !== isStreaming) {
            isStreaming = streamingNow;
            if (!isStreaming) {
                activeStreamKey = "";
                isKeyEdited = false;
            }
            setStreamingUI();
        }
    } catch (error) {
        masterBtn.innerText = "DEVICE OFFLINE";
        masterBtn.className = "action-btn";
        masterBtn.style.backgroundColor = "#3e3e42";
    }
}

function setStreamingUI() {
    if (isStreaming) {
        if (isKeyEdited) {
            masterBtn.innerText = "RESTART WITH NEW KEY";
            masterBtn.className = "action-btn state-restart";
        } else {
            masterBtn.innerText = "STOP STREAM";
            masterBtn.className = "action-btn state-streaming";
        }
    } else {
        masterBtn.innerText = "APPLY & START STREAM";
        masterBtn.className = "action-btn state-idle";
    }
}

async function stopStreamAction() {
    try {
        const response = await fetch(`${BASE_URL}/livestreams/0/stop`, { method: 'PUT' });
        return response.ok || response.status === 204;
    } catch (e) {
        return false;
    }
}

async function startStreamAction(streamKey) {
    try {
        const platformPayload = {
            "platform": "Facebook",
            "server": "Default",
            "quality": "Streaming Low", 
            "key": streamKey
        };

        const keyResponse = await fetch(`${BASE_URL}/livestreams/0/activePlatform`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(platformPayload)
        });

        if (keyResponse.ok || keyResponse.status === 204) {
            await new Promise(resolve => setTimeout(resolve, 350));
            const startResponse = await fetch(`${BASE_URL}/livestreams/0/start`, { method: 'PUT' });
            return startResponse.ok || startResponse.status === 204;
        }
        return false;
    } catch (e) {
        return false;
    }
}

async function handleRebootTrigger() {
    rebootBtn.innerHTML = '<span class="icon">⏽</span><span class="text">Rebooting...</span>';
    rebootBtn.disabled = true;

    try {
        const response = await fetch(`${PROTOCOL_URL}`, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: "SHUTDOWN:\nAction: reboot\n\n"
        });

        if (response.ok) {
            setUIRebootState();
        } else {
            const fallbackResponse = await fetch(`${PROTOCOL_URL}`, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: "HARDWARE CONTROL:\nReboot: true\n\n"
            });
            
            if (fallbackResponse.ok) {
                setUIRebootState();
            } else {
                resetRebootBtn();
            }
        }
    } catch (error) {
        setUIRebootState();
    }
}

function setUIRebootState() {
    masterBtn.innerText = "DEVICE REBOOTING...";
    masterBtn.className = "action-btn";
    masterBtn.style.backgroundColor = "#3e3e42";
    setTimeout(resetRebootBtn, 8000);
}

function resetRebootBtn() {
    rebootBtn.disabled = false;
    rebootBtn.innerHTML = '<span class="icon">⏽</span><span class="text">Reboot</span>';
}

async function handleMasterAction() {
    if (isProcessing) return;
    isProcessing = true;

    const currentTargetKey = getSelectedStreamKey();

    if (isStreaming && isKeyEdited) {
        masterBtn.innerText = "STOPPING PREVIOUS...";

        const stopped = await stopStreamAction();
        if (stopped) {
            let countdown = parseInt(delaySelect.value, 10) || 0; 
            while (countdown > 0) {
                masterBtn.innerText = `WAITING FOR FB TO CLEAR (${countdown}s)...`;
                await new Promise(resolve => setTimeout(resolve, 1000));
                countdown--;
            }

            masterBtn.innerText = "APPLYING NEW TARGET KEY...";

            const started = await startStreamAction(currentTargetKey);
            if (started) {
                activeStreamKey = currentTargetKey;
                isKeyEdited = false;
                isStreaming = true;
            } else {
                isStreaming = false;
            }
        } else {
            isStreaming = false;
        }
        setStreamingUI();
    }
    else if (isStreaming && !isKeyEdited) {
        masterBtn.innerText = "STOPPING...";
        
        const stopped = await stopStreamAction();
        if (stopped) {
            activeStreamKey = "";
            isStreaming = false;
        }
        setStreamingUI();
    } 
    else {
        if (!currentTargetKey) {
            alert("The selected stream key field is empty. Please paste your key first.");
            isProcessing = false;
            return;
        }

        masterBtn.innerText = "PROCESSING...";

        const started = await startStreamAction(currentTargetKey);
        if (started) {
            activeStreamKey = currentTargetKey;
            isKeyEdited = false;
            isStreaming = true;
        } else {
            isStreaming = false;
        }
        setStreamingUI();
    }

    isProcessing = false;
}

document.getElementById('text-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

loadSavedKeys();
checkCurrentStatus();
updateRowFocus();
setInterval(checkCurrentStatus, 3000);
</script>
