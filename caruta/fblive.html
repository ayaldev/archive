<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DZRH News Smart Live Stream</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #fff;
            overflow-x: hidden;
        }

        /* Status Banner for Alert Messages */
        #status-alert {
            background: #ff3333;
            color: #fff;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            display: none;
            position: relative;
            z-index: 999;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { background-color: #ff3333; }
            50% { background-color: #990000; }
            100% { background-color: #ff3333; }
        }

        /* Responsive 16:9 Container */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; 
            height: 0;
            overflow: hidden;
            background: #111;
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        .loading-placeholder {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            letter-spacing: 1px;
            opacity: 0.8;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="status-alert">🚨 STREAM UPDATED! Loading New Live Feed...</div>

    <div id="fb-live-wrapper" class="video-container">
        <div class="loading-placeholder">Initializing automated live tracking...</div>
    </div>

    <script>
        // Use standard Web Audio API to generate a synth beep without needing external audio asset files
        function triggerAlarmSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Play two rapid, distinct alert beeps
                [0, 0.2].forEach((delay) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime + delay); // High A pitch
                    
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + delay + 0.15);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(audioCtx.currentTime + delay);
                    osc.stop(audioCtx.currentTime + delay + 0.15);
                });
            } catch (e) {
                console.warn("Audio alarm failed to trigger (user interaction rules may prevent background audio init).", e);
            }
        }

        let currentVideoId = ""; 
        const checkIntervalMs = 60000; // Background check frequency (pings Jina every 60 seconds)

        async function monitorLiveStream() {
            try {
                const response = await fetch("https://r.jina.ai/https://www.facebook.com/dzrhnews/live_videos");
                if (!response.ok) throw new Error("Jina proxy unavailable");
                
                const pageText = await response.text();
                const matches = pageText.match(/\/videos\/(\d{15,18})/g);
                
                if (matches && matches.length > 0) {
                    const latestVideoId = matches[0].replace("/videos/", "");
                    
                    if (latestVideoId) {
                        // Initial setup condition
                        if (currentVideoId === "") {
                            currentVideoId = latestVideoId;
                            deployIframe(latestVideoId);
                        } 
                        // Condition if stream IDs change (Old live dropped / New live picked up)
                        else if (latestVideoId !== currentVideoId) {
                            console.log(`Stream mutation detected! Swapping ${currentVideoId} ➜ ${latestVideoId}`);
                            currentVideoId = latestVideoId;
                            
                            // Fire warnings and reset video component frame
                            triggerAlarmSound();
                            showTopBanner();
                            deployIframe(latestVideoId);
                        }
                    }
                }
            } catch (error) {
                console.warn("Error inside loop monitoring engine:", error);
                // Fallback run if server hits blank variables early on
                if (currentVideoId === "") {
                    currentVideoId = "27510793398513558";
                    deployIframe(currentVideoId);
                }
            }
        }

        function deployIframe(id) {
            const container = document.getElementById('fb-live-wrapper');
            container.innerHTML = `
                <iframe 
                    src="https://www.facebook.com/plugins/video.php?height=314&href=https%3A%2F%2Fwww.facebook.com%2Fdzrhnews%2Fvideos%2F${id}%2F&show_text=false&width=560&t=0&autoplay=true&mute=true" 
                    scrolling="no" 
                    frameborder="0" 
                    allowfullscreen="true" 
                    allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share">
                </iframe>
            `;
        }

        function showTopBanner() {
            const banner = document.getElementById('status-alert');
            banner.style.display = 'block';
            // Smoothly auto-hide banner after 8 seconds
            setTimeout(() => {
                banner.style.display = 'none';
            }, 8000);
        }

        // Run checking algorithm right out of the gate
        monitorLiveStream();

        // Establish persistent background looping ticker
        setInterval(monitorLiveStream, checkIntervalMs);
    </script>

</body>
</html>
