<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DZRH News Scheduled Stream Monitor</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        #status-alert {
            background: #ff3333;
            color: #fff;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            display: none;
            position: relative;
            z-index: 999;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { background-color: #ff3333; }
            50% { background-color: #990000; }
            100% { background-color: #ff3333; }
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; 
            height: 0;
            overflow: hidden;
            background: #111;
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        /* Floating Manual Refresh Button */
        .floating-refresh-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.2; 
            transition: opacity 0.3s ease, background-color 0.3s ease;
            outline: none;
        }

        .floating-refresh-btn:hover {
            opacity: 1;
            background-color: rgba(255, 255, 255, 0.4);
        }

        .floating-refresh-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

    <div id="status-alert">🚨 STREAM UPDATED! Loading New Live Feed...</div>
    <div id="fb-live-wrapper" class="video-container"></div>

    <button id="manual-refresh" class="floating-refresh-btn" title="Force Refresh Stream Check">
        <svg viewBox="0 0 24 24">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
    </button>

    <script>
        let currentVideoId = "";
        let playbackRefreshCooldown = 0;
        let facebookPlaybackTimer = null;

        function triggerPlaybackRefresh(reason, refreshFn) {
            const now = Date.now();
            if (now < playbackRefreshCooldown) return;
            playbackRefreshCooldown = now + 30000;
            console.log(`[Playback Watch] ${reason}`);
            refreshFn();
        }

        function loadFacebookSdk() {
            if (window.FB) return Promise.resolve();
            return new Promise((resolve, reject) => {
                const existing = document.querySelector('script[src*="connect.facebook.net"]');
                if (existing) {
                    existing.addEventListener('load', () => resolve(), { once: true });
                    existing.addEventListener('error', () => reject(new Error('Facebook SDK failed to load')), { once: true });
                    return;
                }

                const script = document.createElement('script');
                script.src = 'https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v18.0';
                script.async = true;
                script.defer = true;
                script.onload = () => resolve();
                script.onerror = () => reject(new Error('Facebook SDK failed to load'));
                document.head.appendChild(script);
            });
        }

        function watchFacebookPlayback(container, videoId) {
            if (!container) return;
            clearTimeout(facebookPlaybackTimer);
            facebookPlaybackTimer = window.setTimeout(() => {
                const iframe = container.querySelector('iframe');
                if (iframe && iframe.isConnected) {
                    triggerPlaybackRefresh(`Facebook embed ${videoId} stayed stalled`, () => fetchLatestStreamFromJina());
                }
            }, 20000);

            loadFacebookSdk().catch(err => console.warn('Facebook SDK unavailable for playback monitoring:', err));
        }

        function getStoredVideoId(key) {
            return localStorage.getItem(key) || "";
        }

        function saveStoredVideoId(key, value) {
            if (!value) return;
            localStorage.setItem(key, value);
        }

        // Generates an exact MMDDYYHHMMSS string matching your exact format requirements
        function getFormattedTimestamp() {
            const now = new Date();
            
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const year = String(now.getFullYear()).slice(-2); // Gets last two digits of year (e.g., '26')
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            return `${month}${day}${year}${hours}${minutes}${seconds}`;
        }

        function triggerAlarmSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                [0, 0.2].forEach((delay) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime + delay);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + delay + 0.15);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + delay);
                    osc.stop(audioCtx.currentTime + delay + 0.15);
                });
            } catch (e) {
                console.warn("Audio alert blocked by browser interface rules.");
            }
        }

        async function fetchFacebookVideoId() {
            const timestamp = getFormattedTimestamp();
            const targetUrl = `https://r.ayaldev.com/https://www.facebook.com/dzrhnews/live_videos?update=${timestamp}`;
            
            try {
                console.log(`Executing fetch check via: ${targetUrl}`);
                const response = await fetch(targetUrl);
                if (!response.ok) throw new Error('Unreachable');
                
                const pageText = await response.text();
                const matches = pageText.match(/\/videos\/(\d{15,18})/g);
                
                if (matches && matches.length > 0) {
                    const videoId = matches[0].replace("/videos/", "");
                    if (videoId) {
                        return videoId;
                    }
                }
            } catch (error) {
                console.warn(`Fetch failed via ${targetUrl}:`, error);
            }
            return null;
        }

        async function fetchLatestStreamFromJina() {
            try {
                const latestVideoId = await fetchFacebookVideoId();
                if (latestVideoId) {
                    if (latestVideoId !== currentVideoId) {
                        console.log(`New Stream Found! ${currentVideoId} -> ${latestVideoId}`);
                        currentVideoId = latestVideoId;
                        saveStoredVideoId('fblive_videoId', latestVideoId);
                        triggerAlarmSound();
                        showTopBanner();
                        deployIframe(latestVideoId);
                    } else {
                        console.log("Stream check completed: No new stream ID found.");
                    }
                } else {
                    console.log("Stream check completed: No live stream active.");
                }
            } catch (error) {
                console.warn("Jina fetch execution failed:", error);
            }
        }

        function deployIframe(id) {
            const container = document.getElementById('fb-live-wrapper');
            if (!id) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = `
                <iframe 
                    src="https://www.facebook.com/plugins/video.php?height=314&href=https%3A%2F%2Fwww.facebook.com%2Fdzrhnews%2Fvideos%2F${id}%2F&show_text=false&width=560&t=0&autoplay=true&mute=true" 
                    scrolling="no" 
                    frameborder="0" 
                    allowfullscreen="true" 
                    referrerpolicy="strict-origin-when-cross-origin"
                    allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share">
                </iframe>
            `;
            watchFacebookPlayback(container, id);
        }

        function showTopBanner() {
            const banner = document.getElementById('status-alert');
            banner.style.display = 'block';
            setTimeout(() => { banner.style.display = 'none'; }, 8000);
        }

        function runTimeTicker() {
            const now = new Date();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            // Check precisely every 5 minutes
            if (minutes % 5 === 0 && seconds === 0) {
                fetchLatestStreamFromJina();
            }
        }

        // Manual override layout interaction button
        document.getElementById('manual-refresh').addEventListener('click', () => {
            fetchLatestStreamFromJina();
        });

        // 1. Initial Render: Load stored ID first if present then fetch latest stream
        currentVideoId = getStoredVideoId('fblive_videoId');
        if (currentVideoId) {
            deployIframe(currentVideoId);
        }
        fetchLatestStreamFromJina();

        // 2. Ticker loop activation
        setInterval(runTimeTicker, 1000);
    </script>
</body>
</html>
