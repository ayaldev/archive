<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In-Browser Full RVC ONNX Pipeline</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module">
        import { pipeline, AutoProcessor, AutoModel, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.3.0/+esm";
        import * as ort from "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.1/+esm";

        // Route WebAssembly asset pointers back to the CDN distribution path
        ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.1/dist/";
        
        // CRITICAL FIXES FOR THE FETCH ERRORS:
        ort.env.wasm.numThreads = 1; // Force ONNX to run single-threaded
        ort.env.wasm.proxy = false;  // Turn off multi-threaded background web worker proxying

        // Force Transformers.js config layers to adhere strictly to single-threaded modes
        env.backend = 'wasm';
        
        // UI Element References
        const statusEl = document.getElementById('status');
        const progressEl = document.getElementById('progress');
        const progressBarEl = document.getElementById('progressBar');
        const generateBtn = document.getElementById('generateBtn');
        const txtInput = document.getElementById('txtInput');
        const pitchInput = document.getElementById('pitchInput');
        const pitchValue = document.getElementById('pitchValue');
        const audioPlayer = document.getElementById('audioPlayer');

        let ttsPipeline = null;
        let featureExtractor = null;
        let featureModel = null;
        let rvcSession = null;
        
        const RVC_MODEL_URL = "https://huggingface.co/ayaldev/rnrvc/resolve/main/normal200.onnx?download=true";

        // Update pitch label text on slider drag
        pitchInput.addEventListener('input', (e) => {
            pitchValue.textContent = e.target.value > 0 ? `+${e.target.value}` : e.target.value;
        });

        // Initialize and warm up all necessary components completely client-side
        async function initApp() {
            try {
                updateStatus("Loading Frontend TTS Engine...", "animate-pulse text-blue-400");
                // Explicitly pass execution providers and restrict thread compilation bounds
                ttsPipeline = await pipeline('text-to-speech', 'Xenova/mms-tts-eng', { 
                    quantized: true,
                    session_options: { executionProviders: ['wasm'], numThreads: 1 }
                });

                updateStatus("Loading Feature Extraction Layers...", "animate-pulse text-amber-400");
                featureExtractor = await AutoProcessor.from_pretrained("Xenova/hubert-base-ls960");
                featureModel = await AutoModel.from_pretrained("Xenova/hubert-base-ls960", { 
                    quantized: true,
                    session_options: { executionProviders: ['wasm'], numThreads: 1 }
                });

                updateStatus("Allocating converted RVC ONNX model (~50MB)...", "animate-pulse text-purple-400");
                rvcSession = await ort.InferenceSession.create(RVC_MODEL_URL, { 
                    executionProviders: ['wasm'] 
                });

                updateStatus("All models loaded successfully!", "text-green-400 font-semibold");
                generateBtn.disabled = false;
                progressEl.classList.add('hidden');
            } catch (error) {
                console.error(error);
                updateStatus(`Initialization failed: ${error.message}`, "text-red-400 font-bold");
            }
        }

        function updateStatus(msg, classes) {
            statusEl.innerText = msg;
            statusEl.className = `text-sm text-center mt-2 ${classes}`;
        }

        // Execution Pipeline: Text -> Wave -> Feature Extractor -> RVC ONNX Matrix
        async function handleSynthesis() {
            const text = txtInput.value.trim();
            const pitchShift = parseInt(pitchInput.value, 10);
            if (!text) return;

            try {
                generateBtn.disabled = true;
                progressEl.classList.remove('hidden');
                
                // 1. Generate baseline text-to-speech waveform
                progressBarEl.style.width = "25%";
                updateStatus("Synthesizing base vocal wave...", "text-blue-400 animate-pulse");
                const baseOutput = await ttsPipeline(text);
                const rawAudioFloats = baseOutput.audio;

                // 2. Extract hidden state embeddings to satisfy the 'phone' input requirement
                progressBarEl.style.width = "50%";
                updateStatus("Extracting hidden audio features ('phone' vector)...", "text-amber-400 animate-pulse");
                const processedFeatures = await featureExtractor(rawAudioFloats, { sampling_rate: 16000 });
                const modelOutputs = await featureModel(processedFeatures);
                
                const phoneFeatures = modelOutputs.last_hidden_state.data; 
                const dimensions = modelOutputs.last_hidden_state.dims; 

                progressBarEl.style.width = "75%";
                updateStatus("Executing custom RVC ONNX voice conversion...", "text-purple-400 animate-pulse");

                // 3. Construct input feeds mapping to the exported model signature
                const rvcInputs = {
                    "phone": new ort.Tensor('float32', phoneFeatures, dimensions),
                    "pitch": new ort.Tensor('int64', new BigInt64Array([BigInt(pitchShift)]), [1])
                };

                // Execute inference pass
                const outputMap = await rvcSession.run(rvcInputs);
                const outputTensor = outputMap[rvcSession.outputNames[0]];
                const outputFloats = outputTensor.data;

                // 4. Output the processed sound array back to the web browser interface
                const targetSampleRate = 24000; 
                const audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: targetSampleRate });
                const finalBuffer = audioContext.createBuffer(1, outputFloats.length, targetSampleRate);
                finalBuffer.getChannelData(0).set(outputFloats);

                const blob = await bufferToWavBlob(finalBuffer);
                const audioUrl = URL.createObjectURL(blob);
                
                audioPlayer.src = audioUrl;
                audioPlayer.classList.remove('hidden');
                
                progressBarEl.style.width = "100%";
                updateStatus("Voice conversion finished!", "text-green-400 font-semibold");
            } catch (err) {
                console.error(err);
                updateStatus(`Synthesis error: ${err.message}`, "text-red-400");
            } finally {
                generateBtn.disabled = false;
            }
        }

        // Standard PCM wave header converter
        function bufferToWavBlob(audioBuffer) {
            const numOfChan = audioBuffer.numberOfChannels;
            const length = audioBuffer.length * numOfChan * 2 + 44;
            const buffer = new ArrayBuffer(length);
            const view = new DataView(buffer);
            const channels = [];
            
            let i, sample, offset = 0, pos = 0;

            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

            setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
            setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
            setUint32(audioBuffer.sampleRate); setUint32(audioBuffer.sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);

            for (i = 0; i < audioBuffer.numberOfChannels; i++) channels.push(audioBuffer.getChannelData(i));
            while (pos < length) {
                for (i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                    view.setInt16(pos, sample, true); pos += 2;
                }
                offset++;
            }
            return new Blob([buffer], { type: 'audio/wav' });
        }

        window.addEventListener('DOMContentLoaded', initApp);
        generateBtn.addEventListener('click', handleSynthesis);
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl w-full max-w-lg border border-slate-700">
        <h1 class="text-xl font-bold text-center mb-1 text-purple-400">RVC ONNX Pipeline</h1>
        <p class="text-xs text-slate-400 text-center mb-6">Text → Feature Extractor → Custom Voice Output</p>

        <div class="bg-slate-950 p-3 rounded-lg border border-slate-900 mb-4">
            <div id="status" class="text-sm text-center text-slate-400">Loading system dependencies...</div>
            <div id="progress" class="w-full bg-slate-800 h-1.5 rounded-full mt-2 overflow-hidden">
                <div id="progressBar" class="bg-purple-500 h-1.5 w-0 transition-all duration-300"></div>
            </div>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Target Script Text</label>
                <textarea id="txtInput" class="w-full h-24 bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-purple-500 resize-none" placeholder="Type text here to render directly via your model inputs..."></textarea>
            </div>

            <div>
                <div class="flex justify-between text-xs font-semibold uppercase text-slate-400 mb-1">
                    <span>Model Pitch Tuning</span>
                    <span id="pitchValue" class="text-purple-400 font-mono">0</span>
                </div>
                <input id="pitchInput" type="range" min="-12" max="12" value="0" class="w-full accent-purple-500 h-2 bg-slate-950 rounded-lg appearance-none cursor-pointer">
            </div>

            <button id="generateBtn" disabled class="w-full py-3 bg-purple-600 hover:bg-purple-700 disabled:bg-slate-700 disabled:cursor-not-allowed rounded-xl font-medium transition text-sm cursor-pointer shadow-lg shadow-purple-900/20">
                Generate Voice Output
            </button>

            <div class="flex justify-center pt-2">
                <audio id="audioPlayer" controls class="hidden w-full max-w-xs mt-2"></audio>
            </div>
        </div>
    </div>

</body>
</html>
